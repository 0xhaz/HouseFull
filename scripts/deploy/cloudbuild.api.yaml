# Builds the API image on Cloud Build (x86, no emulation) and pushes it to Artifact Registry.
#   gcloud builds submit --config scripts/deploy/cloudbuild.api.yaml \
#     --substitutions=_TAG=$(git rev-parse --short HEAD) .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - us-east4-docker.pkg.dev/$PROJECT_ID/housefull/api:${_TAG}
      - -t
      - us-east4-docker.pkg.dev/$PROJECT_ID/housefull/api:latest
      - .
images:
  - us-east4-docker.pkg.dev/$PROJECT_ID/housefull/api:${_TAG}
  - us-east4-docker.pkg.dev/$PROJECT_ID/housefull/api:latest
substitutions:
  _TAG: manual
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
