packages:
  - apps/*
  - packages/*
  - scripts

allowBuilds:
  "@swc/core": true
  esbuild: true
  simple-git-hooks: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@nestjs/common@12.1.3'
  - '@nestjs/core@12.1.3'
  - '@nestjs/platform-express@12.1.3'
  - '@nestjs/testing@12.1.3'
  - '@vitest/coverage-v8@5.0.4'
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - vitest@5.0.4
  - zod@4.6.7
  - '@clerk/nextjs@7.9.15'
  - '@clerk/ui@1.40.1'
